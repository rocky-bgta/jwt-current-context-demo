server:
  port: 8080
spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/current-context-demo}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
app:
  jwt-secret: ${JWT_SECRET}
  demo-username: ${DEMO_USERNAME:demo}
  demo-password: ${DEMO_PASSWORD}
  token-hours: 2

name: Java CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests
        env:
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long-123
          DEMO_PASSWORD: ci-only-password
        run: mvn -B test
